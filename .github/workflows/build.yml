# Matrix build with an include: mapping. Each entry pins an image name to its folder.
# Generated from testenv/topology/topology.yaml by testenv/topology/generate.js. Do not edit by hand.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - service: ledger
            dir: services/ledger
          - service: tax
            dir: services/tax
          - service: fx-rates
            dir: services/fx-rates
          - service: fraud
            dir: services/fraud
          - service: reconciler
            dir: services/reconciler
          - service: statements
            dir: services/statements
          - service: payouts
            dir: services/payouts
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSH_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.AR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          push: true
          provenance: false
          tags: ${{ vars.AR_REPO }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ vars.AR_REPO }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
